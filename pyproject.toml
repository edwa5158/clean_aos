[project]
name = "clean-aos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.0"]

[tool.pytest.ini_options]
markers = [
    "architecture: enforces an architectural rule against real project code",
    "meta: verifies the architecture test machinery itself",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes - undefined names, unused imports
    "I",   # isort - import config
    "UP",  # pyupgrade - modernize for your target version
    "B",   # bugbear - likely bugs
    "SIM", # simplify
]
