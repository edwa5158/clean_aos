[project]
name = "clean-aos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
]

[dependency-groups]
dev = ["ruff>=0.16.0", "ty>=0.0.63", { include-group = "test" }]
test = [
    "coverage>=7.15.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-flask>=1.3.0",
    "tox>=4.58.0",
]

[tool.pytest.ini_options]
markers = [
    "architecture: enforces an architectural rule against real project code",
    "meta: verifies the architecture test machinery itself",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes - undefined names, unused imports
    "I",   # isort - import config
    "UP",  # pyupgrade - modernize for your target version
    "B",   # bugbear - likely bugs
    "SIM", # simplify
]
